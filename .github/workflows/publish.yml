name: Publish site

# Renders the site and deploys it to the gh-pages branch, which GitHub Pages serves.
# Pushing to main is all that's needed — no local `quarto publish` step.
on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you re-run it by hand from the Actions tab

# The publish step pushes the rendered site to the gh-pages branch.
permissions:
  contents: write

# If you push twice quickly, cancel the older run rather than racing it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # cv.qmd and publications.qmd contain R chunks, so Quarto renders them through
      # the knitr engine. The parsers in R/ are base R, but knitr itself is not built in.
      - name: Install R packages needed by the knitr engine
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render and deploy to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
