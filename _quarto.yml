project:
  type: website
  output-dir: _site
  # The blog is on hold: noice/ stays in the repo but is not built or published.
  # To bring it back, delete the "!noice/**" line below and uncomment the navbar
  # entry further down.
  render:
    - "**/*.qmd"
    - "!noice/**"

website:
  title: "Andrea Vaiano"
  description: "Academic website"
  navbar:
    left:
      - href: index.qmd
        text: Bio
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - text: Talks & Teaching
        menu:
          - href: talks/teaching.qmd
            text: Teaching (TA)
          - href: talks/seminars.qmd
            text: Seminars
          - href: talks/conferences.qmd
            text: Conferences
      - href: cv.qmd
        text: CV
      # - href: noice/index.qmd
      #   text: Noice - my blog
    right:
      - icon: envelope
        href: "mailto:andrea.vaiano@uniroma1.it"
      - icon: github
        href: "https://github.com/andyvaia"

  page-footer:
    left: "© Andrea Vaiano"
    right: >-
      Built with <a href="https://quarto.org">Quarto</a> and
      <i class="bi bi-heart-fill" aria-hidden="true"></i> in
      <a href="https://www.r-project.org"><img src="/images/Rlogo.svg"
      class="footer-logo" alt="R"></a>

format:
  html:
    theme: editorial.scss
    css: styles.css
    toc: false
    page-layout: full
